name: "🧪 CI — Static Gate & Unit Tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: "Tier 1 Gate (codespell, ruff, pyright, pytest)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check spelling (codespell)
        run: uvx codespell@latest -s

      - name: Lint & format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Static type check (pyright)
        run: uv run pyright

      - name: Run unit tests with coverage (pytest)
        run: uv run pytest
